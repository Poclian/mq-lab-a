queue_rules:
  - name: default
    merge_conditions:
      - label=ready-to-merge

pull_request_rules:
  - name: approve
    conditions:
      - label=do-approve
    actions:
      review:
        type: APPROVE
        message: "LGTM"
        bot_account: "Pockriglian"

  - name: queue approved PRs
    conditions:
      - label=go-queue
      - "#approved-reviews-by>=1"
    actions:
      queue:
        name: default
